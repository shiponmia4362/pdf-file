<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />

        <title>Cute Lamp 💡 with Login Form</title>
        <style>
            *,
            *:after,
            *:before {
                box-sizing: border-box;
            }

            :root {
                --cord: hsl(210, 0%, calc((40 + (var(--on, 0) * 50)) * 1%));
                --opening: hsl(
                    50,
                    calc((10 + (var(--on, 0) * 80)) * 1%),
                    calc((20 + (var(--on, 0) * 70)) * 1%)
                );
                --feature: #0a0a0a;
                --accent: 210;
                --tongue: #e06952;
                --base-top: hsl(
                    var(--accent),
                    0%,
                    calc((40 + (var(--on, 0) * 40)) * 1%)
                );
                --base-side: hsl(
                    var(--accent),
                    0%,
                    calc((20 + (var(--on, 0) * 40)) * 1%)
                );
                --post: hsl(
                    var(--accent),
                    0%,
                    calc((20 + (var(--on, 0) * 40)) * 1%)
                );
                --b-1: hsla(
                    45,
                    calc((0 + (var(--on, 0) * 0)) * 1%),
                    calc((50 + (var(--on, 0) * 50)) * 1%),
                    0.85
                );
                --b-2: hsla(
                    45,
                    calc((0 + (var(--on, 0) * 0)) * 1%),
                    calc((20 + (var(--on, 0) * 30)) * 1%),
                    0.25
                );
                --b-3: hsla(
                    45,
                    calc((0 + (var(--on, 0) * 0)) * 1%),
                    calc((20 + (var(--on, 0) * 30)) * 1%),
                    0.5
                );
                --b-4: hsla(
                    45,
                    calc((0 + (var(--on, 0) * 0)) * 1%),
                    calc((20 + (var(--on, 0) * 30)) * 1%),
                    0.25
                );
                --l-1: hsla(
                    45,
                    calc((0 + (var(--on, 0) * 20)) * 1%),
                    calc((50 + (var(--on, 0) * 50)) * 1%),
                    0.85
                );
                --l-2: hsla(
                    45,
                    calc((0 + (var(--on, 0) * 20)) * 1%),
                    calc((50 + (var(--on, 0) * 50)) * 1%),
                    0.85
                );
                --shade-hue: 320;
                --t-1: hsl(
                    var(--shade-hue),
                    calc((0 + (var(--on, 0) * 20)) * 1%),
                    calc((30 + (var(--on, 0) * 60)) * 1%)
                );
                --t-2: hsl(
                    var(--shade-hue),
                    calc((0 + (var(--on, 0) * 20)) * 1%),
                    calc((20 + (var(--on, 0) * 35)) * 1%)
                );
                --t-3: hsl(
                    var(--shade-hue),
                    calc((0 + (var(--on, 0) * 20)) * 1%),
                    calc((10 + (var(--on, 0) * 20)) * 1%)
                );
                --glow-color: hsl(320, 40%, 45%);
                --glow-color-dark: hsl(320, 40%, 35%);
            }

            body {
                min-height: 100vh;
                display: grid;
                place-items: center;
                background: #121921;
                margin: 0;
                font-family: system-ui, -apple-system, sans-serif;
            }

            .container {
                display: flex;
                align-items: center;
                justify-content: center;
                gap: 8vmin;
                flex-wrap: wrap;
                padding: 2rem;
            }

            .login-form {
                background: rgba(18, 25, 33, 0.9);
                padding: 2rem 1.3rem;
                border-radius: 20px;
                min-width: 320px;
                opacity: 0;
                transform: scale(0.8) translateY(20px);
                pointer-events: none;
                transition: all 0.5s cubic-bezier(0.34, 1.56, 0.64, 1);
                border: 2px solid transparent;
                box-shadow: 0 0 0px rgba(255, 255, 255, 0);
            }

            .login-form.active {
                opacity: 1;
                transform: scale(1) translateY(0);
                pointer-events: all;
                border-color: var(--glow-color);
                box-shadow: 0 0 15px rgba(255, 255, 255, 0.1),
                    0 0 30px var(--glow-color),
                    inset 0 0 15px rgba(255, 255, 255, 0.05);
            }

            .login-form h2 {
                color: #fff;
                font-size: 2rem;
                margin: 0 0 2rem 0;
                text-align: center;
                text-shadow: 0 0 8px var(--glow-color);
            }

            .form-group {
                margin-bottom: 1.5rem;
            }

            .form-group label {
                display: block;
                color: #aaa;
                font-size: 0.9rem;
                margin-bottom: 0.5rem;
                text-shadow: 0 0 5px var(--glow-color);
            }

            .form-group input {
                width: 100%;
                padding: 0.75rem 1rem;
                background: rgba(255, 255, 255, 0.05);
                border: 2px solid rgba(255, 255, 255, 0.1);
                border-radius: 10px;
                color: #fff;
                font-size: 1rem;
                transition: all 0.3s ease;
            }

            .form-group input:focus {
                outline: none;
                border-color: var(--glow-color);
                box-shadow: 0 0 10px var(--glow-color);
                background: rgba(255, 255, 255, 0.08);
            }

            .form-group input::placeholder {
                color: #666;
            }

            .login-btn {
                width: 100%;
                padding: 0.875rem;
                background: linear-gradient(
                    135deg,
                    var(--glow-color),
                    var(--glow-color-dark)
                );
                border: none;
                border-radius: 10px;
                color: #fff;
                font-size: 1rem;
                font-weight: 600;
                cursor: pointer;
                transition: all 0.3s ease;
                box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
                margin-top: 0.5rem;
            }

            .login-btn:hover {
                transform: translateY(-2px);
                box-shadow: 0 6px 20px rgba(0, 0, 0, 0.3),
                    0 0 20px var(--glow-color);
            }

            .login-btn:active {
                transform: translateY(0);
            }

            .form-footer {
                margin-top: 1.5rem;
                text-align: center;
            }

            .forgot-link {
                color: #888;
                font-size: 0.9rem;
                text-decoration: none;
                transition: all 0.3s ease;
            }

            .forgot-link:hover {
                color: var(--glow-color);
                text-shadow: 0 0 10px var(--glow-color);
            }

            .radio-controls {
                position: absolute;
                width: 1px;
                height: 1px;
                padding: 0;
                margin: -1px;
                overflow: hidden;
                clip: rect(0, 0, 0, 0);
                white-space: nowrap;
                border-width: 0;
            }

            .lamp {
                display: none;
                height: 40vmin;
                overflow: visible !important;
            }

            .cord {
                stroke: var(--cord);
            }

            .cord--rig {
                display: none;
            }

            .lamp__tongue {
                fill: var(--tongue);
            }

            .lamp__hit {
                cursor: pointer;
                opacity: 0;
            }

            .lamp__feature {
                fill: var(--feature);
            }

            .lamp__stroke {
                stroke: var(--feature);
            }

            .lamp__mouth,
            .lamp__light {
                opacity: var(--on, 0);
            }

            .shade__opening {
                fill: var(--opening);
            }

            .shade__opening-shade {
                opacity: calc(1 - var(--on, 0));
            }

            .post__body {
                fill: var(--post);
            }

            .base__top {
                fill: var(--base-top);
            }

            .base__side {
                fill: var(--base-side);
            }

            .top__body {
                fill: var(--t-3);
            }
        </style>
    </head>

<style>
    .ultra-login * {
        box-sizing: border-box !important;
        margin: 0;
        padding: 0;
    }.ultra-login {
    font-family: Arial, sans-serif !important;
}

.ultra-login-body {
    background: linear-gradient(135deg, #1900ff, #ff00c8) !important;
}

.ultra-login .login-box {
    width: 90%;
    max-width: 700px;
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    grid-gap: 15px;
    margin: auto;
    padding-top: 4px;
}











.ultra-login .user-btn {
    padding: 10px;
    font-size: 15px;
    font-weight: bold;
    border: none;
    border-radius: 5px;
    color: #fff;
    cursor: pointer;
    transition: 0.3s;
}
















.ultra-login .user-btn:hover {
    transform: scale(1.05);
    box-shadow: 0 0 20px rgba(255,255,255,0.5);
}

.ultra-login .modal {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background: rgba(0,0,0,0.7);
    display: none;
    justify-content: center;
    align-items: center;
    animation: fadeIn 0.4s;
    z-index: 999999;
}

@keyframes fadeIn {
    from { opacity: 0; }
    to { opacity: 1; }
}

.ultra-login .modal-content {
    background: #fff;
    padding: 25px;
    width: 90%;
    max-width: 400px;
    border-radius: 15px;
    position: relative;
    text-align: center;
    animation: scaleBox 0.4s;
}

@keyframes scaleBox {
    from { transform: scale(0.7); opacity: 0; }
    to { transform: scale(1); opacity: 1; }
}

.ultra-login .close-btn {
    position: absolute;
    top: 10px;
    right: 15px;
    font-size: 25px;
    cursor: pointer;
    color: red;
}

.ultra-login .profile-img {
    width: 120px;
    height: 120px;
    border-radius: 50%;
    margin-bottom: 15px;
    border: 4px solid #1900ff;
}

.ultra-login .contact {
    margin-top: 20px;
    font-size: 18px;
    font-weight: bold;
}

.ultra-login .contact a {
    display: block;
    margin-top: 8px;
    text-decoration: none;
    font-size: 17px;
    color: #1900ff;
    font-weight: bold;
}

          <script>
            const {
                gsap,
                gsap: { registerPlugin, set, to, timeline },
                MorphSVGPlugin,
                Draggable,
            } = window;
            registerPlugin(MorphSVGPlugin);

            const AUDIO = {
                CLICK: new Audio("https://assets.codepen.io/605876/click.mp3"),
            };

            const ON = document.querySelector("#on");
            const OFF = document.querySelector("#off");
            const LOGIN_FORM = document.querySelector(".login-form");

            let startX;
            let startY;

            const PROXY = document.createElement("div");

            const CORDS = gsap.utils.toArray(".cords path");
            const CORD_DURATION = 0.1;
            const HIT = document.querySelector(".lamp__hit");
            const DUMMY_CORD = document.querySelector(".cord--dummy");
            const ENDX = DUMMY_CORD.getAttribute("x2");
            const ENDY = DUMMY_CORD.getAttribute("y2");
            const RESET = () => {
                set(PROXY, {
                    x: ENDX,
                    y: ENDY,
                });
            };
            RESET();

            const STATE = {
                ON: false,
            };

            gsap.set([".cords", HIT], {
                x: -10,
            });

            gsap.set(".lamp__eye", {
                rotate: 180,
                transformOrigin: "50% 50%",
                yPercent: 50,
            });

            const CORD_TL = timeline({
                paused: true,
                onStart: () => {
                    STATE.ON = !STATE.ON;
                    set(document.documentElement, { "--on": STATE.ON ? 1 : 0 });
                    const hue = gsap.utils.random(0, 359);
                    set(document.documentElement, { "--shade-hue": hue });

                    const glowColor = `hsl(${hue}, 40%, 45%)`;
                    const glowColorDark = `hsl(${hue}, 40%, 35%)`;
                    set(document.documentElement, {
                        "--glow-color": glowColor,
                    });
                    set(document.documentElement, {
                        "--glow-color-dark": glowColorDark,
                    });

                    set(".lamp__eye", {
                        rotate: STATE.ON ? 0 : 180,
                    });

                    set([DUMMY_CORD, HIT], { display: "none" });
                    set(CORDS[0], { display: "block" });
                    AUDIO.CLICK.play();

                    if (STATE.ON) {
                        ON.setAttribute("checked", true);
                        OFF.removeAttribute("checked");
                        LOGIN_FORM.classList.add("active");
                    } else {
                        ON.removeAttribute("checked");
                        OFF.setAttribute("checked", true);
                        LOGIN_FORM.classList.remove("active");
                    }
                },
                onComplete: () => {
                    set([DUMMY_CORD, HIT], { display: "block" });
                    set(CORDS[0], { display: "none" });
                    RESET();
                },
            });

            for (let i = 1; i < CORDS.length; i++) {
                CORD_TL.add(
                    to(CORDS[0], {
                        morphSVG: CORDS[i],
                        duration: CORD_DURATION,
                        repeat: 1,
                        yoyo: true,
                    })
                );
            }

            Draggable.create(PROXY, {
                trigger: HIT,
                type: "x,y",
                onPress: (e) => {
                    startX = e.x;
                    startY = e.y;
                },
                onDrag: function () {
                    set(DUMMY_CORD, {
                        attr: {
                            x2: this.x,
                            y2: Math.max(400, this.y),
                        },
                    });
                },
                onRelease: function (e) {
                    const DISTX = Math.abs(e.x - startX);
                    const DISTY = Math.abs(e.y - startY);
                    const TRAVELLED = Math.sqrt(DISTX * DISTX + DISTY * DISTY);
                    to(DUMMY_CORD, {
                        attr: { x2: ENDX, y2: ENDY },
                        duration: CORD_DURATION,
                        onComplete: () => {
                            if (TRAVELLED > 50) {
                                CORD_TL.restart();
                            } else {
                                RESET();
                            }
                        },
                    });
                },
            });

            gsap.set(".lamp", { display: "block" });
        </script>

<script>
(function(){

// Original HTML inside ShadowRoot
shadow.innerHTML = `

    .close-btn{position:absolute;top:10px;left:10px;background:rgba(0,0,0,.4);color:#fff;padding:6px 10px;border-radius:6px;cursor:pointer;z-index:50}

    .zoom-inner{transition:transform .2s ease;transform-origin:center;position:relative;}
  </style>

  <button class="open-btn" id="openPdf" style="
      background: linear-gradient(45deg, #ff6ec4, #7873f5, #42f5ef, #f5e942);
      color: #000;
      font-size: 16px;
      padding: 12px 24px;
      border-radius: 12px;
      border: none;
  "
  onmouseover="this.style.transform='scale(1.1)'; this.style.boxShadow='0 8px 25px rgba(0,0,0,.5)';"
  onmouseout="this.style.transform='scale(1)'; this.style.boxShadow='0 5px 20px rgba(0,0,0,.4)';"
  >Open CV</button>

  <div class="viewer-backdrop" id="backdrop">
    <div class="pdf-box" id="pdfBox">
      <div class="close-btn" id="closePdf">✕</div>

      <div class="ctrls">
        <button id="zin">＋</button>
        <button id="zout">－</button>
        <button id="reset">Reset</button>
        <button id="download">Download</button>
      </div>

      <div class="zoom-wrapper" id="zWrap">
        <div class="zoom-inner" id="zInner">
          <canvas id="pdfCanvas"></canvas>
        </div>
      </div>

    </div>
  </div>
`;


// IMPORT PDF.JS INTO SHADOW DOM
const pdfScript = document.createElement("script");
pdfScript.src = "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.min.js";
shadow.appendChild(pdfScript);

const pdfWorker = document.createElement("script");
pdfWorker.src = "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.worker.min.js";
shadow.appendChild(pdfWorker);

// After script loads — run your JS
pdfScript.onload = () => {

const PDF_URL = "https://raw.githubusercontent.com/shiponmia4362/pdf-file/3a6a864ca8b2cd71fc417ed29341dd9f6b4cb7b7/MY%20CV%20in%20English.pdf";

const openBtn = shadow.getElementById("openPdf");
const backdrop = shadow.getElementById("backdrop");
const box = shadow.getElementById("pdfBox");
const closeBtn = shadow.getElementById("closePdf");
const canvas = shadow.getElementById("pdfCanvas");
const zInner = shadow.getElementById("zInner");

let pdfDoc = null;
let scale = 1;

openBtn.onclick = () => {
  backdrop.classList.add("active");
  setTimeout(()=>box.classList.add("open"),20);
  if(!pdfDoc) loadPDF();
};

closeBtn.onclick = () => {
  box.classList.remove("open");
  setTimeout(()=>backdrop.classList.remove("active"),400);
};

async function loadPDF(){
  pdfjsLib.GlobalWorkerOptions.workerSrc = "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.worker.min.js";
  let loading = pdfjsLib.getDocument(PDF_URL);
  pdfDoc = await loading.promise;
  renderPage();
}

async function renderPage(){
  const page = await pdfDoc.getPage(1);

  const viewport = page.getViewport({scale:1});
  const boxWidth = canvas.parentElement.clientWidth;

  let baseScale = boxWidth / viewport.width;
  const dpr = window.devicePixelRatio || 1;

  let finalScale = baseScale * dpr;
  const hdViewport = page.getViewport({scale:finalScale});

  canvas.width = hdViewport.width;
  canvas.height = hdViewport.height;
  canvas.style.width = (hdViewport.width / dpr) + "px";
  canvas.style.height = (hdViewport.height / dpr) + "px";

  const ctx = canvas.getContext("2d");

  await page.render({canvasContext:ctx, viewport:hdViewport}).promise;
}

const zin = shadow.getElementById("zin");
const zout = shadow.getElementById("zout");
const reset = shadow.getElementById("reset");

zin.onclick = ()=>{ scale += .25; applyZoom(); };
zout.onclick = ()=>{ scale = Math.max(.5, scale - .25); applyZoom(); };
reset.onclick = ()=>{ scale = 1; applyZoom(); };

function applyZoom(){ zInner.style.transform = `scale(${scale})`; }

// Drag Pan
let dragging=false,startX=0,startY=0,x=0,y=0;

shadow.getElementById("zWrap").addEventListener("pointerdown", e=>{
  dragging=true;
  startX=e.clientX-x;
  startY=e.clientY-y;
});

document.addEventListener("pointermove", e=>{
  if(!dragging) return;
  x=e.clientX-startX;
  y=e.clientY-startY;
  zInner.style.left=x+"px";
  zInner.style.top=y+"px";
});

document.addEventListener("pointerup", ()=> dragging=false);

shadow.getElementById("download").onclick = ()=> window.open(PDF_URL, "_blank");

}; // onload end

})();
</script>
